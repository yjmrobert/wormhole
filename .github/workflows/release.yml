name: release
# Three ways to cut a release; all end in a v* tag and a GitHub Release:
#   1. push a v* tag;
#   2. dispatch this workflow with a version;
#   3. create a branch named release/v<version> (for environments that can
#      create branches but not tags). The workflow creates the tag from
#      that branch head; the branch can be deleted afterwards.
on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (creates the tag)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: create tag
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/heads/release/}}"
          case "$VERSION" in v[0-9]*) ;; *) echo "version must look like v0.1.0, got $VERSION"; exit 1;; esac
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists; checking it out"
            git fetch origin "refs/tags/$VERSION:refs/tags/$VERSION"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "$VERSION"
            git push origin "refs/tags/$VERSION"
          fi
          git checkout -q "refs/tags/$VERSION"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
