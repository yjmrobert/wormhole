name: release
# A release is a v* tag on main; nothing else. Push the tag and this
# workflow tests, builds and publishes it:
#
#   make release TAG=v0.4.0
#
# Where a tag cannot be pushed (a hosted session behind a git proxy, say),
# dispatch this workflow on main with the version instead: it creates the
# same tag through the Actions token and carries on as if it had been
# pushed. Either way no branch is involved.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.4.0 (creates the tag on main)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: tag main
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          case "$VERSION" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "version must look like v0.4.0, got $VERSION"; exit 1;; esac
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "dispatch the release on main, not on $GITHUB_REF"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists; re-run its release instead of dispatching"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "refs/tags/$VERSION"
      - name: refuse a tag that is not on main
        if: github.event_name == 'push'
        run: |
          set -eu
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME points at a commit that is not on main; releases come from main only"; exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
