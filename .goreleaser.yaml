# Release artifacts are built by .github/workflows/release.yml on every
# v* tag. Run `goreleaser release --snapshot --clean` locally to test.
version: 2
project_name: wormhole

before:
  hooks:
    - go mod tidy

builds:
  - id: wormhole
    main: ./cmd/wormhole
    binary: wormhole
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tarballs
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - skills/wormhole/SKILL.md
      - deploy/**/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: yjmrobert
    name: wormhole
  draft: false
  prerelease: auto
  header: |
    Linux binaries for amd64 and arm64, with the deploy templates and the
    skill inside each tarball. Verify with `sha256sum -c checksums.txt`.

    Install:

    ```
    curl -fsSLO https://github.com/yjmrobert/wormhole/releases/download/{{ .Tag }}/wormhole_{{ .Version }}_linux_amd64.tar.gz
    tar -xzf wormhole_{{ .Version }}_linux_amd64.tar.gz
    install -m 0755 wormhole ~/.local/bin/wormhole
    ```

    or `go install github.com/yjmrobert/wormhole/cmd/wormhole@{{ .Tag }}`.
    Docs: https://yjmrobert.github.io/wormhole/
